<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>GambitTube Player — Смотреть онлайн</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #151922;
      --bg-card-hover: #1e2430;
      --accent: #ff4a80;
      --accent-hover: #ff2d6b;
      --accent-cyan: #00d2ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #232a38;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Подложка "выключить свет" */
    #cinema-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    body.cinema-mode #cinema-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* ШАПКА */
    header {
      background: rgba(21, 25, 34, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 22px;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      background: linear-gradient(45deg, var(--accent), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      -webkit-text-fill-color: initial;
    }

    /* ОСНОВНОЙ КОНТЕНТ */
    .container {
      max-width: 1300px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* ПЛЕЕР */
    .player-section {
      position: relative;
      z-index: 45; /* выше cinema overlay */
    }

    .player-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .anime-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .player-controls-top {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 74, 128, 0.15);
      border: 1px solid var(--border);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ПАНЕЛЬ УПРАВЛЕНИЯ ПЛЕЕРОМ */
    .player-bar {
      margin-top: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .episode-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .tag.highlight {
      background: rgba(255, 74, 128, 0.15);
      color: var(--accent);
      border: 1px solid rgba(255, 74, 128, 0.3);
    }

    /* ИНФО О ВИДЕО / РЕЛИЗЕ */
    .anime-card {
      margin-top: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .anime-desc {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 14px;
    }

    /* САЙДБАР: СПИСОК СЕРИЙ */
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
    }

    .input-field {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    /* Список серий (эпизодов) */
    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .episodes-list::-webkit-scrollbar {
      width: 4px;
    }
    .episodes-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .episode-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-main);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text-main);
    }

    .episode-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 74, 128, 0.4);
    }

    .episode-item.active {
      background: rgba(255, 74, 128, 0.1);
      border-color: var(--accent);
    }

    .episode-num {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: var(--accent-cyan);
      min-width: 28px;
    }

    .episode-item.active .episode-num {
      color: var(--accent);
    }

    .episode-details {
      flex: 1;
      overflow: hidden;
    }

    .episode-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Фон затемнения при клике "Выключить свет" -->
  <div id="cinema-overlay" onclick="toggleCinemaMode()"></div>

  <!-- Шапка -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">
        <span>GambitTube</span>Play
        <span class="logo-badge">HD</span>
      </a>
      <div style="font-size: 13px; color: var(--text-muted);">
        Лучшие озвучки про Gambit от AniLarp!
      </div>
    </div>
  </header>

  <!-- Основная часть -->
  <main class="container">
    
    <!-- Секция плеера -->
    <section class="player-section">
      <div class="player-header">
        <h1 class="anime-title" id="current-title">Gambit RP</h1>
        <div class="player-controls-top">
          <button class="btn-action" onclick="toggleCinemaMode()">💡</button>
        </div>
      </div>

      <!-- Встраиваемый плеер -->
      <div class="video-wrapper">
        <iframe 
          id="main-player" 
          src="" 
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>

      <!-- Панель тегов и кнопок под плеером -->
      <div class="player-bar">
        <div class="episode-tags">
          <span class="tag highlight">Озвучка: Дубляж / Оригинал</span>
          <span class="tag">Качество: 8K Ultra HD</span>
          <span class="tag">Сервер: GambitRP Garry's Mod</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-action" onclick="prevEpisode()">◀ Предыдущая</button>
          <button class="btn-action" style="border-color: var(--accent); color: #fff;" onclick="nextEpisode()">Следующая ▶</button>
        </div>
      </div>

      <!-- Описание тайтла -->
      <div class="anime-card">
        <div class="card-title">О ролике</div>
        <p class="anime-desc" id="current-desc">
          Эпичные разборки кланов.
        </p>
      </div>
    </section>

    <!-- Боковая панель -->
    <aside class="sidebar-section">
      
      <!-- Список плейлистов и серий -->
      <div class="card">
        <div class="card-title">Выберите Сериал / Плейлист</div>
        <select id="playlist-select" class="input-field" style="width: 100%; margin-bottom: 16px; cursor: pointer;" onchange="switchPlaylist(this.value)">
          <!-- Опции генерируются через JS -->
        </select>

        <div class="card-title">Список серий</div>
        <div class="episodes-list" id="episodes-list">
          <!-- Генерируется через JS -->
        </div>
      </div>

    </aside>

  </main>

  <script>
    // СПИСОК ПЛЕЙЛИСТОВ И СЕРИАЛОВ
    // Сюда можно добавлять как ID/ссылки YouTube, так и полные ссылки на Google Drive
    const playlists = [
      {
        name: "Во Все Флажкие (1 Сезон)",
        videos: [
          {
            id: "B65cKXKD1N8",
            title: "Эпизод 1: Это - не мет!",
            desc: "Парагон решает разобраться с негодником из Los Gambitos, который зафрикилил его подсоса. ╾ Озвучка: Нерокс. Монтаж: Нерокс."
          },
          {
            id: "5ff1JBHqmwQ",
            title: "Эпизод 2: Последний Танец",
            desc: "Озверевший Лекси, уже предавший решёток, внезапно решает захватить флаг на вокзале, где его встречают Нерокс и Фембойчик. После попытки Лекси скрыться - обе стороны открывают огонь. ╾ Озвучка: Нет. Монтаж: Klauds."
          },
          {
            id: "nqpT9yrsZ6A",
            title: "Эпизод 3: Я и есть опасность!",
            desc: "Раздор Парагона и Mini Boss Дианочки. От отчаяния Парагон решает зайти на первый сервер и расширить своё влияние. ╾ Озвучка: Нерокс. Монтаж: Нерокс."
          },
          {
            id: "1ECf306j51U",
            title: "Эпизод 4: Встреча Двух Серверов",
            desc: "Переговоры сильнейших кланов первого и второго сервера. Парагон запугивает лидера клана hotel breakfast. ╾ Озвучка: Фембойчик, Нерокс. Монтаж: Фембойчик."
          }
        ]
      },
      {
        name: "Гамбитские Войны (1 Сезон)",
        videos: [
          {
            id: "SieNjXZGlhw",
            title: "Эпизод 1: Атака Неира",
            desc: "Неир и его тиммейты решаются на отважный шаг: уличить темного Императора Парагона в читерстве, а так же забанить его. Казалось бы, прибывший на помощь Лекси состоит в решетках, что может пойти не так? ╾ Озвучка: Нерокс. Монтаж: Нерокс."
          },
          {
            id: "6SYGv7Ey4S0",
            title: "Эпизод 2: Месть Лекси",
            desc: "Лекси получает пермач на гамбите из-за кидания запреток на стриме Чешира, разъярённый, он выходит из клана #, и под влиянием Императора Парагона решается на это... ╾ Озвучка: Фембойчик, Нерокс. Монтаж: Фембойчик, Нерокс."
          }
        ]
      },
      {
        name: "Гамбитский Гуль (1 Сезон)",
        videos: [
          {
            id: "https://drive.google.com/file/d/1IXXbftVZYaRbRF9o8ZNBICB-2KRI-IUk/view?usp=sharing",
            title: "Эпизод 1: Я... Совет Клановец",
            desc: "Mini Boss Дианочка оказывается не той, за кого себя выдаёт... ╾ Озвучка: Фембойчик. Монтаж: Фембойчик."
      },
      {
        name: "Рофланы",
        videos: [
          {
            id: "laoJuzzuqDM",
            title: "Праймовый neair (2025)",
            desc: "Праймовый neair залетает на флаг в 2025 году GambitRP2. Основано на реальных событиях. ╾ Озвучка: Нерокс. Монтаж: Нерокс."
          }
        ]
      }
    ];

    let currentPlaylistIndex = 0;
    let currentVideoIndex = 0;

    // Универсальная функция получения ссылки для плеера (YouTube / Google Drive)
    function getEmbedUrl(source) {
      if (!source) return "";
      
      // Обработка ссылок Google Drive
      if (source.includes("drive.google.com")) {
        const driveMatch = source.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || source.match(/id=([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) {
          return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
        }
        return source;
      }

      // Обработка ссылок или чистого ID с YouTube
      let ytId = source;
      if (source.includes("youtube.com") || source.includes("youtu.be")) {
        const ytMatch = source.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
        if (ytMatch && ytMatch[1]) {
          ytId = ytMatch[1];
        }
      }

      return `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
    }

    // Инициализация выпадающего списка плейлистов
    function renderPlaylistSelect() {
      const select = document.getElementById("playlist-select");
      select.innerHTML = "";
      playlists.forEach((pl, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = pl.name;
        select.appendChild(opt);
      });
    }

    // Переключение плейлиста
    function switchPlaylist(idx) {
      currentPlaylistIndex = parseInt(idx, 10);
      loadVideo(0);
    }

    // Загрузка видео в плеер
    function loadVideo(index) {
      const activeVideos = playlists[currentPlaylistIndex].videos;
      if (index < 0 || index >= activeVideos.length) return;
      
      currentVideoIndex = index;
      const item = activeVideos[currentVideoIndex];

      const player = document.getElementById("main-player");
      player.src = getEmbedUrl(item.id);

      document.getElementById("current-title").textContent = item.title;
      document.getElementById("current-desc").textContent = item.desc || "Описание отсутствует.";

      renderList();
    }

    // Отрисовка списка серий активного плейлиста
    function renderList() {
      const container = document.getElementById("episodes-list");
      container.innerHTML = "";
      const activeVideos = playlists[currentPlaylistIndex].videos;

      activeVideos.forEach((item, idx) => {
        const isDrive = (item.id || "").includes("drive.google.com");
        const sourcePlatform = isDrive ? "Google Drive" : "YouTube";

        const div = document.createElement("div");
        div.className = `episode-item ${idx === currentVideoIndex ? "active" : ""}`;
        div.onclick = () => loadVideo(idx);

        div.innerHTML = `
          <div class="episode-num">#${idx + 1}</div>
          <div class="episode-details">
            <div class="episode-name">${item.title}</div>
            <div class="episode-sub">${sourcePlatform} • HD</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Навигация
    function nextEpisode() {
      const activeVideos = playlists[currentPlaylistIndex].videos;
      if (currentVideoIndex + 1 < activeVideos.length) {
        loadVideo(currentVideoIndex + 1);
      } else {
        alert("Это последний ролик в этом плейлисте!");
      }
    }

    function prevEpisode() {
      if (currentVideoIndex - 1 >= 0) {
        loadVideo(currentVideoIndex - 1);
      }
    }

    // Режим кинотеатра
    function toggleCinemaMode() {
      document.body.classList.toggle("cinema-mode");
    }

    // Инициализация при загрузке
    window.onload = () => {
      renderPlaylistSelect();
      loadVideo(0);
    };
  </script>
</body>
</html>
